{% extends 'base.html' %}{% block title %}{{ titulo }}{% endblock %}{% block content %}<div class="page-head"><div><h1 class="h3">{{ titulo }}</h1><p class="text-muted">O catálogo preenche categoria, unidade e descrição quando o material é reconhecido.</p></div><a class="btn btn-outline-secondary" href="{{ url_for('materiais') }}">Voltar</a></div><div class="card shadow-sm form-card"><div class="card-body"><form method="post"><div class="row g-3"><div class="col-md-7"><label class="form-label">Material *</label><input class="form-control" list="listaMateriais" id="nomeMaterial" name="nome" value="{{ material.nome if material else '' }}" required><datalist id="listaMateriais">{% for item in catalogo_materiais %}<option value="{{ item.nome }}">{{ item.categoria }} · {{ item.unidade }}</option>{% endfor %}</datalist></div><div class="col-md-5"><label class="form-label">Categoria</label><input class="form-control" name="categoria" value="{{ material.categoria if material else '' }}"></div><div class="col-md-4"><label class="form-label">Unidade</label><input class="form-control" name="unidade" value="{{ material.unidade if material else 'un' }}"></div><div class="col-md-4"><label class="form-label">Estoque mínimo</label><input type="number" step="0.01" min="0" class="form-control" name="estoque_minimo" value="{{ material.estoque_minimo if material else 0 }}"></div><div class="col-12"><label class="form-label">Descrição</label><textarea class="form-control" rows="3" name="descricao">{{ material.descricao if material else '' }}</textarea></div></div><button class="btn btn-primary mt-4">Salvar</button></form></div></div>{% endblock %}
