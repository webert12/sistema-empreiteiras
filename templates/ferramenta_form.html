{% extends 'base.html' %}{% block title %}{{ titulo }}{% endblock %}{% block content %}<div class="page-head"><div><h1 class="h3">{{ titulo }}</h1><p class="text-muted">Cadastro de ferramenta.</p></div><a class="btn btn-outline-secondary" href="{{ url_for('ferramentas') }}">Voltar</a></div><div class="card shadow-sm form-card"><div class="card-body"><form method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nome *</label><input class="form-control" name="nome" value="{{ ferramenta.nome if ferramenta else '' }}" required></div><div class="col-md-6"><label class="form-label">Categoria *</label><input class="form-control" name="categoria" value="{{ ferramenta.categoria if ferramenta else '' }}" required></div><div class="col-md-4"><label class="form-label">Unidade</label><input class="form-control" name="unidade" value="{{ ferramenta.unidade if ferramenta else 'un' }}"></div><div class="col-md-4"><label class="form-label">Estoque mínimo</label><input type="number" step="0.01" min="0" class="form-control" name="estoque_minimo" value="{{ ferramenta.estoque_minimo if ferramenta else 0 }}"></div><div class="col-md-4"><label class="form-label">Estoque atual</label><input type="number" step="0.01" min="0" class="form-control" name="estoque_atual" value="{{ ferramenta.estoque_atual if ferramenta else 0 }}"></div><div class="col-12"><label class="form-label">Descrição</label><textarea class="form-control" rows="3" name="descricao">{{ ferramenta.descricao if ferramenta else '' }}</textarea></div></div><button class="btn btn-primary mt-4">Salvar</button></form></div></div>{% endblock %}
