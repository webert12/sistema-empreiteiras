<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · Construtora Pro</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body class="login-page"><div class="login-card"><div class="text-center mb-4"><div class="brand-icon">🏗️</div><h1 class="h3 fw-bold">Construtora Pro</h1><p class="text-muted mb-0">Acesso seguro ao sistema</p></div>{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ 'danger' if category == 'error' else category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" action="{{ url_for('login') }}"><div class="mb-3"><label class="form-label">Usuário</label><input class="form-control form-control-lg" name="usuario" autocomplete="username" required></div><div class="mb-4"><label class="form-label">Senha</label><input type="password" class="form-control form-control-lg" name="senha" autocomplete="current-password" required></div><button class="btn btn-primary btn-lg w-100">Entrar</button></form></div></body></html>
