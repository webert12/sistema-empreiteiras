{% extends 'base.html' %}{% block title %}{{ titulo }} · Construtora Pro{% endblock %}{% block content %}<div class="page-head"><div><h1 class="h3">{{ titulo }}</h1><p class="text-muted">Cadastro administrativo da empreiteira.</p></div><a class="btn btn-outline-secondary" href="{{ url_for('admin_dashboard') }}">Voltar</a></div><div class="card shadow-sm form-card"><div class="card-body"><form method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">Razão social *</label><input class="form-control" name="razao_social" value="{{ empresa.razao_social if empresa else '' }}" required></div><div class="col-md-6"><label class="form-label">Nome fantasia *</label><input class="form-control" name="nome_fantasia" value="{{ empresa.nome_fantasia if empresa else '' }}" required></div><div class="col-md-4"><label class="form-label">CNPJ</label><input class="form-control" name="cnpj" value="{{ empresa.cnpj if empresa else '' }}"></div><div class="col-md-4"><label class="form-label">Telefone</label><input class="form-control" name="telefone" value="{{ empresa.telefone if empresa else '' }}"></div><div class="col-md-4"><label class="form-label">E-mail</label><input type="email" class="form-control" name="email" value="{{ empresa.email if empresa else '' }}"></div><div class="col-12"><label class="form-label">Endereço</label><input class="form-control" name="endereco" value="{{ empresa.endereco if empresa else '' }}"></div></div><div class="mt-4 d-flex gap-2"><button class="btn btn-primary">Salvar</button><a class="btn btn-outline-secondary" href="{{ url_for('admin_dashboard') }}">Cancelar</a></div></form></div></div>{% endblock %}
