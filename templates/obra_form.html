{% extends 'base.html' %}{% block title %}{{ titulo }}{% endblock %}{% block content %}<div class="page-head"><div><h1 class="h3">{{ titulo }}</h1><p class="text-muted">Dados da obra.</p></div><a class="btn btn-outline-secondary" href="{{ url_for('obras') }}">Voltar</a></div><div class="card shadow-sm form-card"><div class="card-body"><form method="post"><div class="row g-3"><div class="col-md-8"><label class="form-label">Nome da obra *</label><input class="form-control" name="nome" value="{{ obra.nome if obra else '' }}" required></div><div class="col-md-4"><label class="form-label">Status</label><select class="form-select" name="status">{% for chave,nome in status_obras.items() %}<option value="{{ chave }}" {% if obra and obra.status == chave %}selected{% endif %}>{{ nome }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Cliente</label><input class="form-control" name="cliente" value="{{ obra.cliente if obra else '' }}"></div><div class="col-md-6"><label class="form-label">Responsável</label><input class="form-control" name="responsavel" value="{{ obra.responsavel if obra else '' }}"></div><div class="col-12"><label class="form-label">Endereço</label><input class="form-control" name="endereco" value="{{ obra.endereco if obra else '' }}"></div><div class="col-md-6"><label class="form-label">Data de início</label><input type="date" class="form-control" name="data_inicio" value="{{ obra.data_inicio.strftime('%Y-%m-%d') if obra and obra.data_inicio else '' }}"></div><div class="col-md-6"><label class="form-label">Previsão de término</label><input type="date" class="form-control" name="previsao_termino" value="{{ obra.previsao_termino.strftime('%Y-%m-%d') if obra and obra.previsao_termino else '' }}"></div><div class="col-12"><label class="form-label">Observações</label><textarea class="form-control" rows="4" name="observacoes">{{ obra.observacoes if obra else '' }}</textarea></div></div><button class="btn btn-primary mt-4">Salvar</button></form></div></div>{% endblock %}
