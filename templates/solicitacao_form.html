{% extends 'base.html' %}{% block title %}Nova solicitação{% endblock %}{% block content %}<div class="page-head"><div><h1 class="h3">Nova solicitação</h1><p class="text-muted">A solicitação ficará pendente até a compra e confirmação.</p></div><a class="btn btn-outline-secondary" href="{{ url_for('solicitacoes') }}">Voltar</a></div><div class="card shadow-sm form-card"><div class="card-body"><form method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">Obra *</label><select class="form-select" name="obra_id" required><option value="">Selecione</option>{% for obra in obras %}<option value="{{ obra.id }}">{{ obra.nome }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Tipo *</label><select class="form-select" name="tipo" id="tipoRecurso"><option value="material">Material</option><option value="ferramenta">Ferramenta</option><option value="outro">Outro</option></select></div><div class="col-12" id="blocoCatalogo"><label class="form-label">Recurso *</label><select class="form-select" name="recurso_id" id="recursoId"><option value="">Selecione</option>{% for m in materiais %}<option data-tipo="material" value="{{ m.id }}">{{ m.nome }} · {{ m.categoria }} · {{ m.unidade }}</option>{% endfor %}{% for f in ferramentas %}<option data-tipo="ferramenta" value="{{ f.id }}">{{ f.nome }} · {{ f.categoria }} · {{ f.unidade }}</option>{% endfor %}</select></div><div class="col-12 d-none" id="blocoOutro"><label class="form-label">Nome do recurso *</label><input class="form-control" name="recurso_nome"></div><div class="col-md-4"><label class="form-label">Quantidade *</label><input type="number" min="0.01" step="0.01" class="form-control" name="quantidade" required></div><div class="col-12"><label class="form-label">Observação</label><textarea class="form-control" rows="4" name="observacao"></textarea></div></div><button class="btn btn-primary mt-4">Enviar solicitação</button></form></div></div>{% endblock %}{% block scripts %}<script>const tipo=document.getElementById('tipoRecurso'), bloco=document.getElementById('blocoCatalogo'), outro=document.getElementById('blocoOutro'), sel=document.getElementById('recursoId');function atualiza(){const v=tipo.value; bloco.classList.toggle('d-none',v==='outro'); outro.classList.toggle('d-none',v!=='outro'); [...sel.options].forEach((o,i)=>{if(i===0){o.hidden=false;return;}o.hidden=o.dataset.tipo!==v;});sel.value='';}tipo.addEventListener('change',atualiza);atualiza();</script>{% endblock %}
