{% extends 'base.html' %}{% block title %}{{ titulo }}{% endblock %}{% block content %}<div class="page-head"><div><h1 class="h3">{{ titulo }}</h1><p class="text-muted">{{ empresa.nome_fantasia }}</p></div><a class="btn btn-outline-secondary" href="{{ url_for('funcionarios') }}">Voltar</a></div><div class="card shadow-sm form-card"><div class="card-body"><form method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nome *</label><input class="form-control" name="nome" value="{{ funcionario.nome if funcionario else '' }}" required></div><div class="col-md-6"><label class="form-label">Usuário *</label><input class="form-control" name="usuario" value="{{ funcionario.usuario if funcionario else '' }}" required></div><div class="col-md-6"><label class="form-label">Senha {{ '' if funcionario else '*' }}</label><input type="password" class="form-control" name="senha" autocomplete="new-password" {% if not funcionario %}required{% endif %}></div><div class="col-md-6"><label class="form-label">Função *</label><select class="form-select" name="funcao" required>{% for chave,nome in funcoes_funcionarios.items() %}<option value="{{ chave }}" {% if funcionario and funcionario.funcao == chave %}selected{% endif %}>{{ nome }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label">Obras vinculadas</label><div class="row g-2">{% for obra in obras %}<div class="col-md-6"><label class="border rounded p-2 w-100"><input type="checkbox" name="obras" value="{{ obra.id }}" {% if obras_selecionadas is defined and obra.id in obras_selecionadas %}checked{% endif %}> {{ obra.nome }}</label></div>{% else %}<div class="text-muted">Cadastre uma obra primeiro.</div>{% endfor %}</div></div></div><button class="btn btn-primary mt-4">Salvar</button></form></div></div>{% endblock %}
