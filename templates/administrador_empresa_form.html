{% extends 'base.html' %}{% block title %}{{ titulo }}{% endblock %}{% block content %}<div class="page-head"><div><h1 class="h3">{{ titulo }}</h1><p class="text-muted">{{ empresa.nome_fantasia }}</p></div><a class="btn btn-outline-secondary" href="{{ url_for('monitorar_empresa', empresa_id=empresa.id) }}">Voltar</a></div><div class="card shadow-sm form-card"><div class="card-body"><form method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nome *</label><input class="form-control" name="nome" value="{{ administrador.nome if administrador else '' }}" required></div><div class="col-md-6"><label class="form-label">Usuário *</label><input class="form-control" name="usuario" value="{{ administrador.usuario if administrador else '' }}" required></div><div class="col-md-6"><label class="form-label">{{ 'Nova senha (opcional)' if administrador else 'Senha *' }}</label><input type="password" class="form-control" name="senha" {{ '' if administrador else 'required' }} autocomplete="new-password"></div>{% if administrador %}<div class="col-md-6 d-flex align-items-end"><div class="form-check"><input class="form-check-input" type="checkbox" name="ativo" id="ativo" {% if administrador.ativo %}checked{% endif %}><label class="form-check-label" for="ativo">Administrador ativo</label></div></div>{% endif %}</div><button class="btn btn-primary mt-4">Salvar</button></form></div></div>{% endblock %}
